<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>个人资料</title>
	<link href="../bootstrap3/css/bootstrap.css" rel="stylesheet" type="text/css">
	<script src="../bootstrap3/jquery-1.9.1.min.js"></script>
	<script src="../bootstrap3/js/bootstrap.js"></script>
</head>
<body>
<div class="container" style="margin-top: 50px;">
	<div class="col-md-6 col-md-offset-3">
		<h2>个人资料</h2>
		<form id="form-user-info" class="form-horizontal">
			<div class="form-group">
				<label class="col-md-3 control-label">用户名：</label>
				<div class="col-md-8">
					<input id="username" type="text" class="form-control" disabled>
				</div>
			</div>
			<div class="form-group">
				<label class="col-md-3 control-label">手机号：</label>
				<div class="col-md-8">
					<input name="phone" type="text" class="form-control" placeholder="请输入手机号">
				</div>
			</div>
			<div class="form-group">
				<label class="col-md-3 control-label">邮箱：</label>
				<div class="col-md-8">
					<input name="email" type="email" class="form-control" placeholder="请输入邮箱">
				</div>
			</div>
			<div class="form-group">
				<label class="col-md-3 control-label">性别：</label>
				<div class="col-md-8">
					<label class="radio-inline">
						<input type="radio" name="gender" value="0"> 女
					</label>
					<label class="radio-inline">
						<input type="radio" name="gender" value="1"> 男
					</label>
					<label class="radio-inline">
						<input type="radio" name="gender" value="2"> 保密
					</label>
				</div>
			</div>
			<div class="form-group">
				<div class="col-md-offset-3 col-md-8">
					<button type="button" id="btn-save-info" class="btn btn-primary">保存修改</button>
				</div>
			</div>
		</form>
	</div>
</div>

<script>
	$(document).ready(function() {
		loadUserInfo();

		$('#btn-save-info').click(function() {
			$.ajax({
				url: '/users/change_info',
				type: 'POST',
				data: $('#form-user-info').serialize(),
				dataType: 'json',
				success: function(res) {
					if (res.state === 200) {
						alert('修改成功！');
					} else {
						alert('修改失败：' + res.message);
					}
				},
				error: function(xhr) {
					if (xhr.status === 401 || xhr.responseText.indexOf('登录') !== -1) {
						alert('登录已过期，请重新登录');
						window.location.href = '/web/login.html';
					} else {
						alert('请求失败，请重试');
					}
				}
			});
		});

		function loadUserInfo() {
			$.ajax({
				url: '/users/get_by_uid',
				type: 'GET',
				dataType: 'json',
				success: function(res) {
					if (res.state === 200) {
						var user = res.data;
						$('#username').val(user.username);
						$('input[name="phone"]').val(user.phone || '');
						$('input[name="email"]').val(user.email || '');
						if (user.gender !== null && user.gender !== undefined) {
							$('input[name="gender"][value="' + user.gender + '"]').prop('checked', true);
						}
					}
				},
				error: function(xhr) {
					if (xhr.status === 401 || xhr.responseText.indexOf('登录') !== -1) {
						alert('登录已过期，请重新登录');
						window.location.href = '/web/login.html';
					}
				}
			});
		}
	});
</script>
</body>
</html>
